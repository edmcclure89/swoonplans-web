# Weekly check that every venue we recommend still has a working website.
#
# Venue domains expire quietly. Three in this dataset were sold to domain
# squatters and one now points at a competitor's restaurant — none of which
# returns a 404, so nothing catches them except an actual check.
#
# Runs from GitHub's network (clean egress), which matters: a proxied or
# datacentre-blocked network produces false "dead" results on hotel and
# restaurant sites that use bot protection.
name: Venue link audit

on:
  schedule:
    - cron: '0 13 * * 1' # Mondays, 9am ET
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/data/metros.ts'
      - 'src/lib/linkHealth.ts'
      - 'src/data/venueLinkStatus.ts'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Fast, deterministic, no network. Guards the detection rules themselves.
      - name: Validator unit tests
        run: npm run test:links

      - name: Install Chromium for the browser pass
        run: npx playwright install --with-deps chromium

      # Non-blocking: a broken venue link should raise a flag, not wedge the
      # pipeline. Read the summary and update src/data/venueLinkStatus.ts.
      - name: Audit venue links
        id: audit
        continue-on-error: true
        run: npm run audit:links -- --browser 2>&1 | tee audit.log

      - name: Publish report
        if: always()
        run: |
          {
            echo '## Venue link audit'
            echo ''
            echo '```'
            tail -n 120 audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venue-link-audit
          path: audit.log
