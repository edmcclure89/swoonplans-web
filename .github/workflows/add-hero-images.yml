name: Add kids hero image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download image
        run: |
          curl -sSL --fail -o public/images/kids-birthday-party-hug.webp "https://n.uguu.se/TcDuXAMg.webp"

      - name: Verify checksum
        run: |
          echo "3a30b0b272a04723629f0087d7fb338c1896ee2bf6bf0b502c8489a0720be551  public/images/kids-birthday-party-hug.webp" | sha256sum -c -

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/kids-birthday-party-hug.webp
          git commit -m "Add kids birthday party hug hero image"
          git push
