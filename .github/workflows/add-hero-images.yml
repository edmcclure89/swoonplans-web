name: Add kids hero images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        run: |
          curl -sSL --fail -o public/images/kids-birthday-hug.webp "https://d.uguu.se/ucWipmKZ.webp"
          curl -sSL --fail -o public/images/kids-birthday-hug-portrait.webp "https://n.uguu.se/JBSlCLlR.webp"

      - name: Verify checksums
        run: |
          echo "e9a20c1d692f320398d00809cdf23f6e2cb180bd2583d61ad98f4ece8828e760  public/images/kids-birthday-hug.webp" | sha256sum -c -
          echo "34207965b9b70daef593a54ef53312642d03314f9acd518be15dbc462894475c  public/images/kids-birthday-hug-portrait.webp" | sha256sum -c -

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/kids-birthday-hug.webp public/images/kids-birthday-hug-portrait.webp
          git commit -m "Add kids birthday hug hero images"
          git push
