name: fetch-blog-images
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify images
        run: |
          set -e
          declare -A FILES=(
            ["public/images/weekend-reset.jpg"]="https://n.uguu.se/ZFnkCQct.jpg|51c5c4d552188cfb5a77d2345746dfce58102c736bf1dfdce6045230f0e8aacd"
            ["public/images/creative-catalyst-journal.jpg"]="https://n.uguu.se/iQHXgCAW.jpg|2935963c9df0758d0b0caf92bf6c3df782c25faa777492e3878883127b34c5f3"
            ["public/images/sanctuary-bedroom.jpg"]="https://d.uguu.se/jhMuuzka.jpg|3610d79621b55f1e3261f4529da567d4435e5fb74fcf05fd2a4b00231120de1b"
            ["public/images/morning-routine.jpg"]="https://d.uguu.se/uHvGwQXZ.jpg|90ca7108fdfdd977f53a20729f50649e820a7c66597fd64e43bebee27e7e8097"
            ["public/images/physical-flow-stretch.jpg"]="https://n.uguu.se/xLWQKeoO.jpg|f3473326bc0ed0a7800f312f474e0c4cd35bebf243ce91c78a6c37e3c6f0ba4a"
            ["public/images/party-blueprint.jpg"]="https://h.uguu.se/jjTpqsLn.jpg|cb1fd365bd1b1e919b6dce57ed4fd3f897a37ddebaf2e0d1b1034ad64ba5496c"
            ["public/images/party-themes-backyard.jpg"]="https://d.uguu.se/HrgXvcjP.jpg|03291086133992fae8a05725348df4217f6c1700991e7d81dccf44071e4183e4"
            ["public/images/party-budget.jpg"]="https://d.uguu.se/ShNESFKg.jpg|fd28713f3daa527244d1a308ac12d35931a5540ac598226fb6a42cbb4b2e2c3f"
            ["public/images/managing-groups.jpg"]="https://n.uguu.se/ZBmflwut.jpg|c25ee715ebd499851e99040686746662225b4502e2066828d972e9891627ff17"
            ["public/images/allergy-safe-snacks.jpg"]="https://h.uguu.se/NgzDSWsC.jpg|d915191f3aea4d83ef25d5a21645bad46dbfd492bfad429c874aabbc7075dcd7"
          )
          for path in "${!FILES[@]}"; do
            url="${FILES[$path]%%|*}"
            expected="${FILES[$path]##*|}"
            curl -sSL "$url" -o "$path"
            actual=$(sha256sum "$path" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "CHECKSUM MISMATCH for $path"
              echo "expected: $expected"
              echo "actual:   $actual"
              exit 1
            fi
            echo "OK: $path ($actual)"
          done
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/weekend-reset.jpg public/images/creative-catalyst-journal.jpg public/images/sanctuary-bedroom.jpg public/images/morning-routine.jpg public/images/physical-flow-stretch.jpg public/images/party-blueprint.jpg public/images/party-themes-backyard.jpg public/images/party-budget.jpg public/images/managing-groups.jpg public/images/allergy-safe-snacks.jpg
          git commit -m "Add 10 blog post images (Self Care + Kid Plan)"
          git push
